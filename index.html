<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muradpur Adarsha High School - Registration Card Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF Library for PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="py-6 px-4 md:py-10 bg-slate-900 text-slate-100 font-['Hind_Siliguri',sans-serif] min-h-screen">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center space-x-2 bg-blue-500/10 border border-blue-500/20 px-4 py-1.5 rounded-full mb-3 text-blue-400 text-sm font-semibold">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Muradpur Adarsha High School</span>
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-2">
                Alumni Reunion 2026 Card Maker
            </h1>
            <p class="text-slate-400 text-base md:text-lg max-w-xl mx-auto">
                Tothyo gulo puron korun ebong picture upload kore Registration Card toiri korun.
            </p>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Form Input Controls Panel -->
            <div class="lg:col-span-5 bg-slate-800/90 backdrop-blur border border-slate-700/60 p-6 md:p-8 rounded-2xl shadow-xl">
                <div class="flex items-center justify-between mb-6 border-b border-slate-700 pb-4">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-blue-400"></i> Information Form
                    </h2>
                    <!-- Reset Button -->
                    <button type="button" onclick="resetAllData()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 font-medium">
                        <i class="fa-solid fa-rotate-right"></i> Reset All
                    </button>
                </div>

                <form id="cardForm" onsubmit="generateCard(event)" class="space-y-5">
                    
                    <!-- Profile Picture Upload Input -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">
                            <i class="fa-solid fa-user-gear text-blue-400 mr-1.5"></i> Profile Picture Upload
                        </label>
                        <div class="relative group border-2 border-dashed border-slate-600 hover:border-blue-400 rounded-xl p-4 text-center cursor-pointer transition-colors bg-slate-900/50 flex flex-col items-center justify-center">
                            <input type="file" id="photoInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handlePhotoSelect(event)">
                            
                            <!-- Thumbnail Preview -->
                            <div id="previewContainer" class="hidden mb-2 relative">
                                <img id="userPhotoPreview" src="" alt="Profile Preview" class="w-20 h-20 object-cover rounded-xl border-2 border-blue-400 shadow-md">
                            </div>

                            <div id="uploadPlaceholder" class="flex flex-col items-center justify-center space-y-2">
                                <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                                </div>
                                <p class="text-sm font-medium text-slate-300" id="uploadPhotoLabel">Click here to upload photo</p>
                            </div>
                        </div>
                    </div>

                    <!-- Name Field -->
                    <div>
                        <label for="inputName" class="block text-sm font-semibold text-slate-300 mb-1.5">
                            <i class="fa-solid fa-signature text-blue-400 mr-1.5"></i> Name
                        </label>
                        <input type="text" id="inputName" placeholder="E.g. Fahim Hossain" required oninput="saveInputs()"
                            class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm outline-none transition-all">
                    </div>

                    <!-- Batch Field -->
                    <div>
                        <label for="inputBatch" class="block text-sm font-semibold text-slate-300 mb-1.5">
                            <i class="fa-solid fa-graduation-cap text-blue-400 mr-1.5"></i> Batch
                        </label>
                        <input type="text" id="inputBatch" placeholder="E.g. 2024-2025" required oninput="saveInputs()"
                            class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm outline-none transition-all">
                    </div>

                    <!-- Registration No. Field -->
                    <div>
                        <label for="inputReg" class="block text-sm font-semibold text-slate-300 mb-1.5">
                            <i class="fa-solid fa-id-card text-blue-400 mr-1.5"></i> Registration No.
                        </label>
                        <input type="text" id="inputReg" placeholder="E.g. 05454" required oninput="saveInputs()"
                            class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm outline-none transition-all">
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-500/25 flex items-center justify-center space-x-2 transition-all active:scale-[0.99]">
                            <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                            <span>Submit & Create Card</span>
                        </button>
                    </div>

                </form>
            </div>

            <!-- Live Output Canvas Container -->
            <div class="lg:col-span-7 flex flex-col items-center justify-center">
                
                <div class="w-full flex items-center justify-between mb-3 px-2">
                    <span class="text-sm font-medium text-slate-400 flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Generated Card Result
                    </span>
                    <div class="flex items-center gap-2">
                        <!-- Download PNG Button -->
                        <button id="downloadBtn" onclick="downloadCanvasCard()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-download"></i> PNG
                        </button>
                        <!-- Download PDF Button -->
                        <button id="downloadPdfBtn" onclick="downloadPdfCard()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-file-pdf"></i> PDF
                        </button>
                    </div>
                </div>

                <!-- HTML5 Canvas Element -->
                <div class="w-full flex justify-center bg-slate-900/60 p-3 border border-slate-800 rounded-2xl min-h-[400px] items-center">
                    <canvas id="cardCanvas" class="max-w-full h-auto rounded-xl shadow-2xl border border-slate-700/50" style="display: none;"></canvas>
                    <div id="placeholderBox" class="py-20 text-center text-slate-500">
                        <i class="fa-solid fa-id-card-clip text-5xl mb-3 opacity-40"></i>
                        <p class="text-sm">Submit click korle local <br><strong class="text-slate-300">Alumni Reunion 2026.png</strong> background-e card generate hobe</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- JavaScript Handling Canvas Rendering & LocalStorage -->
    <script>
        const DEFAULT_BG_PATH = 'Alumni Reunion 2026.png';
        let userPhotoObj = null;

        function saveInputs() {
            localStorage.setItem('alumni_name', document.getElementById('inputName').value);
            localStorage.setItem('alumni_batch', document.getElementById('inputBatch').value);
            localStorage.setItem('alumni_reg', document.getElementById('inputReg').value);
        }

        // Reset / Clear All Data Option
        function resetAllData() {
            if (confirm("Apni ki shob tothyo ebong upload kora picture muche (Reset) felte chan?")) {
                localStorage.removeItem('alumni_name');
                localStorage.removeItem('alumni_batch');
                localStorage.removeItem('alumni_reg');
                localStorage.removeItem('alumni_photo');

                document.getElementById('cardForm').reset();
                document.getElementById('previewContainer').classList.add('hidden');
                document.getElementById('uploadPlaceholder').style.display = 'flex';
                document.getElementById('uploadPhotoLabel').innerText = 'Click here to upload photo';
                document.getElementById('cardCanvas').style.display = 'none';
                document.getElementById('placeholderBox').style.display = 'block';
                document.getElementById('downloadBtn').classList.add('hidden');
                document.getElementById('downloadPdfBtn').classList.add('hidden');
                userPhotoObj = null;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('alumni_name');
            const savedBatch = localStorage.getItem('alumni_batch');
            const savedReg = localStorage.getItem('alumni_reg');
            const savedPhoto = localStorage.getItem('alumni_photo');

            if (savedName) document.getElementById('inputName').value = savedName;
            if (savedBatch) document.getElementById('inputBatch').value = savedBatch;
            if (savedReg) document.getElementById('inputReg').value = savedReg;

            if (savedPhoto) {
                const img = new Image();
                img.onload = function() {
                    userPhotoObj = img;
                    const previewImg = document.getElementById('userPhotoPreview');
                    previewImg.src = savedPhoto;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                    document.getElementById('uploadPhotoLabel').innerText = 'Saved Photo Loaded';
                    
                    if (savedName && savedBatch && savedReg) {
                        triggerAutoGenerate();
                    }
                };
                img.src = savedPhoto;
            }
        });

        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('uploadPhotoLabel').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Img = e.target.result;
                    localStorage.setItem('alumni_photo', base64Img);

                    const img = new Image();
                    img.onload = function() {
                        userPhotoObj = img;
                        const previewImg = document.getElementById('userPhotoPreview');
                        previewImg.src = base64Img;
                        document.getElementById('previewContainer').classList.remove('hidden');
                        document.getElementById('uploadPlaceholder').style.display = 'none';
                        triggerAutoGenerate();
                    };
                    img.src = base64Img;
                };
                reader.readAsDataURL(file);
            }
        }

        function triggerAutoGenerate() {
            const nameVal = document.getElementById('inputName').value.trim();
            const batchVal = document.getElementById('inputBatch').value.trim();
            const regVal = document.getElementById('inputReg').value.trim();

            if (userPhotoObj && nameVal && batchVal && regVal) {
                const bgImg = new Image();
                bgImg.src = DEFAULT_BG_PATH;
                bgImg.onload = function() {
                    renderOnCanvas(bgImg, userPhotoObj, nameVal, batchVal, regVal);
                };
            }
        }

        function generateCard(e) {
            e.preventDefault();
            saveInputs();
            triggerAutoGenerate();
        }

        function renderOnCanvas(bgImg, userImg, name, batch, regNo) {
            const canvas = document.getElementById('cardCanvas');
            const ctx= canvas.getContext('2d');

            canvas.width = bgImg.naturalWidth || 1000;
            canvas.height = bgImg.naturalHeight || 1060;

            const w = canvas.width;
            const h = canvas.height;

            ctx.drawImage(bgImg, 0, 0, w, h);

            const photoX = w * 0.071;
            const photoY = h * 0.420;
            const photoW = w * 0.354;
            const photoH = h * 0.392;

            ctx.save();
            const radius = w * 0.02;
            ctx.beginPath();
            ctx.moveTo(photoX + radius, photoY);
            ctx.lineTo(photoX + photoW - radius, photoY);
            ctx.quadraticCurveTo(photoX + photoW, photoY, photoX + photoW, photoY + radius);
            ctx.lineTo(photoX + photoW, photoY + photoH - radius);
            ctx.quadraticCurveTo(photoX + photoW, photoY + photoH, photoX + photoW - radius, photoY + photoH);
            ctx.lineTo(photoX + radius, photoY + photoH);
            ctx.quadraticCurveTo(photoX, photoY + photoH, photoX, photoY + photoH - radius);
            ctx.lineTo(photoX, photoY + radius);
            ctx.quadraticCurveTo(photoX, photoY, photoX + radius, photoY);
            ctx.closePath();
            ctx.clip();

            const imgRatio = userImg.width / userImg.height;
            const frameRatio = photoW / photoH;
            let renderW, renderH, renderX, renderY;

            if (imgRatio > frameRatio) {
                renderH = photoH;
                renderW = photoH * imgRatio;
                renderX = photoX - (renderW - photoW) / 2;
                renderY = photoY;
            } else {
                renderW = photoW;
                renderH = photoW / imgRatio;
                renderX = photoX;
                renderY = photoY - (renderH - photoH) / 2;
            }
            ctx.drawImage(userImg, renderX, renderY, renderW, renderH);
            ctx.restore();

            ctx.fillStyle = "#0b2545";
            ctx.font = `bold ${Math.round(w * 0.042)}px 'Playfair Display', serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(name, w * 0.730, h * 0.515);

            ctx.font = `bold ${Math.round(w * 0.035)}px 'Playfair Display', Georgia, serif`;
            ctx.textAlign = "left";
            ctx.fillText(batch, w * 0.750, h * 0.610);

            ctx.fillText(regNo, w * 0.875, h * 0.672);

            document.getElementById('placeholderBox').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('downloadBtn').classList.remove('hidden');
            document.getElementById('downloadPdfBtn').classList.remove('hidden');
        }

        function downloadCanvasCard() {
            const canvas = document.getElementById('cardCanvas');
            const link = document.createElement('a');
            const nameVal = document.getElementById('inputName').value.trim() || 'Alumni';
            link.download = `Alumni_Card_${nameVal.replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        // PDF Download Option (Background Image সহ লোকাল স্টোরেজ থেকে পিডিএফ জেনারেট করবে)
        function downloadPdfCard() {
            const canvas = document.getElementById('cardCanvas');
            if (!canvas || canvas.style.display === 'none') {
                alert("Agey card generate korun!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const imgData = canvas.toDataURL('image/png', 1.0);
            
            // Standard card size ratio preservation in PDF
            const imgWidth = 210; // A4 width in mm
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            const pdf = new jsPDF({
                orientation: imgHeight > imgWidth ? 'portrait' : 'landscape',
                unit: 'mm',
                format: [imgWidth, imgHeight]
            });

            pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            
            const nameVal = document.getElementById('inputName').value.trim() || 'Alumni';
            pdf.save(`Alumni_Registration_Card_${nameVal.replace(/\s+/g, '_')}.pdf`);
        }
    </script>
</body>
</html>
